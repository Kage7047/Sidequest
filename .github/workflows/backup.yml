# Twice-weekly database backup. The Supabase free plan keeps no backups and pauses a project
# after a week without activity; this run also counts as activity.
# The repo is public, so the dump is encrypted before it is uploaded as an artifact.
# Needs two repository secrets: SUPABASE_DB_URL (Session pooler connection string, with the
# database password) and BACKUP_PASSPHRASE.
# Restore: gpg -d sidequest-*.sql.gz.gpg | gunzip | psql "$DB_URL"
name: Back up Sidequest database

on:
  schedule:
    - cron: '17 2 * * 0,3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    container: postgres:17
    steps:
      - name: Dump, compress and encrypt
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then echo "Backup secrets are not set."; exit 1; fi
          apt-get update -qq && apt-get install -y -qq gnupg >/dev/null
          name="sidequest-$(date -u +%Y-%m-%d).sql.gz.gpg"
          pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges --schema=public --schema=private --schema=auth \
            | gzip -9 \
            | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 -o "$name" 3<<<"$BACKUP_PASSPHRASE"
          echo "BACKUP_FILE=$name" >> "$GITHUB_ENV"
          ls -l "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
          if-no-files-found: error
